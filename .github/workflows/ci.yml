name: tests

# The tests under tests/ are CPU-only: they exercise the scheduler, the block
# manager and Sequence bookkeeping. They never import torch or triton, so CI
# stays fast and needs no GPU runner.
on:
  push:
    branches: [main]
  pull_request:
  # Lets the workflow be run by hand from the Actions tab, which is how it was
  # verified before this PR (see the description).
  workflow_dispatch:

# A new push to the same branch makes the previous run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy xxhash

      - name: Run CPU-only tests
        run: python -m pytest tests -q
